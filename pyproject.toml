[project]
name = "valutatrade_hub"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "gitvan", email = "ivan076nt@mail.ru" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
valutatrade_hub = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["valutatrade_hub", "main.py"]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["venv", ".venv", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = [] 

[dependency-groups]
dev = [
    "ruff>=0.17.2",
]

[tool.valutatrade]
data_dirv = "data"
users_file = "users.json"
portfolios_file = "portfolios.json"
rates_file = "rates.json"
rates_ttl_seconds = 300
base_currency = "USD"
log_file = "logs/actions.log"
log_level = "INFO"
log_max_bytes = 1000000
log_backup_count = 3
